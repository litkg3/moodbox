<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 与页头站标同一只卡通盒子：一颗紫球认不出是「盒子」，方形小盒才认得出 -->
  <defs>
    <linearGradient id="lid" x1="0.2" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#FCF9FF"/>
      <stop offset="1" stop-color="#DCCBF3"/>
    </linearGradient>
    <linearGradient id="body" x1="0.12" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#F5EEFD"/>
      <stop offset="0.52" stop-color="#DDCCF3"/>
      <stop offset="1" stop-color="#BFA6E4"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="46%" r="52%">
      <stop offset="0" stop-color="#C9B6E8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#C9B6E8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#FBF7F3"/>
  <rect width="64" height="64" rx="14" fill="url(#halo)"/>

  <!-- 落地阴影 -->
  <ellipse cx="32" cy="57.6" rx="15" ry="3.2" fill="#8E76B8" opacity="0.16"/>

  <!-- 盒身 -->
  <rect x="11" y="26.8" width="42" height="29.4" rx="7.2" fill="url(#body)"/>

  <!-- 盖子 -->
  <rect x="6.5" y="15.8" width="51" height="15.2" rx="5.6" fill="url(#lid)"/>

  <!-- 盖沿与盒身的缝 -->
  <path d="M9.2 30.4h45.6" stroke="#A98FD2" stroke-width="1.9" stroke-linecap="round" opacity="0.4"/>

  <!-- 盖沿高光 -->
  <path d="M13.2 20.6c5.2-2.2 12.8-2.6 17.2-1.8" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" opacity="0.85"/>

  <!-- 盒身高光 -->
  <path d="M17.4 35c1.6-1.6 3.8-2.4 5.2-2.6" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" opacity="0.6"/>

  <!-- 眼睛 -->
  <g fill="#6C5694" opacity="0.72">
    <circle cx="24.8" cy="41.2" r="3"/>
    <circle cx="39.2" cy="41.2" r="3"/>
  </g>
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="23.8" cy="40.2" r="1"/>
    <circle cx="38.2" cy="40.2" r="1"/>
  </g>

  <!-- 小嘴 -->
  <path d="M29.4 47.4c1.8 1.5 3.4 1.5 5.2 0" stroke="#6C5694" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
</svg>
